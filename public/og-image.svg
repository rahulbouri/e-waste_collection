<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#10b981"/>
  
  <!-- Background pattern -->
  <circle cx="200" cy="150" r="120" fill="#059669" opacity="0.1"/>
  <circle cx="1000" cy="480" r="150" fill="#059669" opacity="0.1"/>
  
  <!-- Main content -->
  <g transform="translate(600, 315)">
    <!-- Icon -->
    <circle cx="0" cy="-50" r="80" fill="white"/>
    
    <!-- Recycling symbol -->
    <g fill="#10b981" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- Top arrow -->
      <path d="M -25 -90 L -55 -80 L -45 -65 Z" fill="white"/>
      <path d="M -55 -80 L -25 -75 L -35 -65" fill="none"/>
      
      <!-- Right arrow -->
      <path d="M 30 -90 L 40 -120 L 20 -105 Z" fill="white"/>
      <path d="M 40 -120 L 35 -90 L 25 -100" fill="none"/>
      
      <!-- Bottom-left arrow -->
      <path d="M -55 -20 L -50 -5 L -65 -15 Z" fill="white"/>
      <path d="M -50 -5 L -55 -20 L -60 -15" fill="none"/>
    </g>
    
    <!-- Curved lines -->
    <path d="M -25 -90 Q -40 -90 -55 -80" fill="none" stroke="white" stroke-width="3"/>
    <path d="M 40 -120 Q 35 -110 35 -90" fill="none" stroke="white" stroke-width="3"/>
    <path d="M -50 -5 Q -55 -25 -55 -20" fill="none" stroke="white" stroke-width="3"/>
    
    <!-- Title -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
      EcoCollect
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle">
      Waste Management for Societies
    </text>
  </g>
</svg>

